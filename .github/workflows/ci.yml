name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: retailpulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailpulse" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retailpulse:ci-only-password@localhost:5432/retailpulse
      DEMO_PASSWORD: ci-demo-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Migrations apply cleanly and are idempotent
        run: npm run db:migrate && npm run db:migrate
      - name: Seed is repeatable
        run: npm run db:seed && npm run db:seed && npm run db:seed -- --reset
      - name: Integration tests (real PostgreSQL)
        run: npm run test:int

  e2e:
    runs-on: ubuntu-latest
    # One happy path through the real UI + API + PostgreSQL (its own throw-away database).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: retailpulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailpulse" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retailpulse:ci-only-password@localhost:5432/retailpulse
      DEMO_PASSWORD: ci-demo-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    # The demo images must keep building (nothing is pushed anywhere).
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t retailpulse/api:ci .
      - run: docker build -f apps/web/Dockerfile -t retailpulse/web:ci .
      - run: docker build -t retailpulse/forecasting:ci services/forecasting

  forecasting:
    runs-on: ubuntu-latest
    # The tests build temporary databases from the API's migrations, so they need PostgreSQL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: retailpulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailpulse" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retailpulse:ci-only-password@localhost:5432/retailpulse
    defaults:
      run:
        working-directory: services/forecasting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/forecasting/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Production dependency audit
        run: pip-audit -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
