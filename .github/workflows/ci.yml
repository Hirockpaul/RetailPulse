name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: retailpulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailpulse" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retailpulse:ci-only-password@localhost:5432/retailpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Migrations apply cleanly and are idempotent
        run: npm run db:migrate && npm run db:migrate
      - name: Seed is repeatable
        run: npm run db:seed && npm run db:seed && npm run db:seed -- --reset
      - name: Integration tests (real PostgreSQL)
        run: npm run test:int

  forecasting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/forecasting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/forecasting/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
