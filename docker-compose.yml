# Only PostgreSQL starts by default. Kafka / observability are added later as optional profiles.
services:
  postgres:
    image: postgres:17-alpine
    container_name: retailpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
