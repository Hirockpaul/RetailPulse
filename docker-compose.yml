# By default only PostgreSQL starts (for local development: `npm run db:up`).
#
# Optional profiles:
#   full           the whole app in containers: migrate + seed, synthetic history, API, forecasting,
#                  web on http://localhost:8080          docker compose --profile full up --build
#   observability  Prometheus (:9090) + Grafana (:3001) with one dashboard. Scrapes the API in the
#                  `full` profile, or a dev API on the host (npm run dev:api).
#                                                        docker compose --profile observability up
#   mlops          MLflow mirror (:5000), SQLite + local artifacts. To mirror full-profile runs:
#                  MLFLOW_TRACKING_URI=http://mlflow:5000 docker compose --profile full --profile mlops up
# All published ports are bound to 127.0.0.1: this is a local demo, not a deployment.

x-database-url: &database-url postgresql://${POSTGRES_USER:-retailpulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retailpulse}

services:
  postgres:
    image: postgres:17-alpine
    container_name: retailpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------- profile: full
  # One-shot: apply migrations, then load the synthetic demo data (both safe to re-run).
  setup:
    profiles: [full]
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: retailpulse/api:local
    command: ['sh', '-c', 'node scripts/migrate.mjs && node scripts/seed.mjs']
    environment:
      DATABASE_URL: *database-url
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # One-shot: 12 months of synthetic sales history for the forecasts (fictional data).
  forecast-history:
    profiles: [full]
    build: services/forecasting
    image: retailpulse/forecasting:local
    command: ['python', '-m', 'app.synthetic']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      setup: { condition: service_completed_successfully }
    restart: 'no'

  forecast-artifacts-init:
    profiles: [full]
    image: alpine:3.23
    command: ['sh', '-c', 'chown -R 10001:10001 /models']
    volumes:
      - model_artifacts:/models
    restart: 'no'

  # Internal only (no login of its own): reachable from the API, never published.
  forecasting:
    profiles: [full]
    build: services/forecasting
    image: retailpulse/forecasting:local
    environment:
      DATABASE_URL: *database-url
      MODEL_ARTIFACT_DIR: /var/lib/retailpulse/models
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    volumes:
      - model_artifacts:/var/lib/retailpulse/models
    depends_on:
      forecast-history: { condition: service_completed_successfully }
      forecast-artifacts-init: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    profiles: [full]
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: retailpulse/api:local
    environment:
      DATABASE_URL: *database-url
      FORECAST_URL: http://forecasting:8000
      API_PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      setup: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    profiles: [full]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: retailpulse/web:local
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- profile: observability
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090'
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true' # read-only viewers without a login (localhost only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on: [prometheus]
    restart: unless-stopped

  # ---------------------------------------------------------------- profile: mlops
  # Optional mirror only. PostgreSQL and the forecasting model_artifacts volume are authoritative.
  mlflow:
    profiles: [mlops]
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - '5000'
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
      - --workers
      - '1'
    environment:
      # MLflow 3.x otherwise starts ~8 background job workers (~150 MB each) for GenAI
      # features this project doesn't use; together they exhausted WSL's RAM.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: 'false'
    mem_limit: 768m
    volumes:
      - mlflow_data:/mlflow
    ports:
      - '127.0.0.1:5000:5000'
    restart: unless-stopped

volumes:
  pgdata:
  model_artifacts:
  mlflow_data:
